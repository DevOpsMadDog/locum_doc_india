version: "3.9"

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: locum
      POSTGRES_PASSWORD: locum
      POSTGRES_DB: locum
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg2://locum:locum@postgres:5432/locum
      JWT_SECRET: change-me
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  clinic-web:
    build:
      context: ./apps/clinic-web
    environment:
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
